site_name: Manual de OpenShift Dev Spaces
site_description: >-
  Ambientes de desenvolvimento na nuvem, prontos no navegador, definidos como
  código
repo_url: https://github.com/edtroleis/techdocs-manuais
edit_uri: edit/main/dev-spaces/docs/
nav:
  - Início: index.md
  - Onboarding:
      - Trilha de onboarding: onboarding/trilha.md
      - Primeiros 30 minutos: onboarding/primeiros-30-minutos.md
      - Primeiro dia: onboarding/primeiro-dia.md
      - Primeira semana: onboarding/primeira-semana.md
  - Uso:
      - Workspaces: uso/workspaces.md
      - Devfile: uso/devfile.md
      - Editores: uso/editores.md
      - Boas práticas: uso/boas-praticas.md
  - Administração:
      - Instalação: administracao/instalacao.md
      - Configuração: administracao/configuracao.md
  - Problemas comuns: problemas-comuns.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true

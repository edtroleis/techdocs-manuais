site_name: Manual de WSL
site_description: Guia de preparação do Windows Subsystem for Linux
repo_url: https://github.com/edtroleis/techdocs-manuais
edit_uri: edit/main/wsl/docs/
nav:
  - Início: index.md
  - Instalação: instalacao.md
  - Distribuições: distribuicoes.md
  - Configuração: configuracao.md
  - Validação: validacao.md
  - Problemas comuns: problemas-comuns.md
plugins:
  - techdocs-core
markdown_extensions:
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
strict: true
